name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VALHEIM_APPID: "896660"
  # Keep in sync with Qmod/Package/manifest.json (denikson-BepInExPack_Valheim).
  BEPINEX_PACK: "5.4.2333"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build Qmod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Valheim install path
        run: echo "VALHEIM_INSTALL=$HOME/VHINSTALL" >> "$GITHUB_ENV"

      - name: Valheim dedicated server build id
        id: valheimversion
        run: |
          buildid="unknown"
          if info=$(curl -fsSL --max-time 60 "https://api.steamcmd.net/v1/info/${VALHEIM_APPID}"); then
            parsed=$(printf '%s' "$info" | jq -r --arg app "$VALHEIM_APPID" '.data[$app].depots.branches.public.buildid // empty')
            if [ -n "$parsed" ] && [ "$parsed" != "null" ]; then
              buildid="$parsed"
            fi
          else
            echo "steamcmd.net lookup failed"
          fi
          echo "Valheim dedicated server buildid: $buildid"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      - name: Cache Valheim install
        id: cachevalheim
        uses: actions/cache@v5
        with:
          path: ${{ env.VALHEIM_INSTALL }}
          key: valheim-${{ steps.valheimversion.outputs.buildid }}-bepinex-${{ env.BEPINEX_PACK }}-linux

      - name: Install Valheim dedicated server and BepInEx
        if: steps.cachevalheim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 unzip
          mkdir -p "$HOME/steamcmd"
          curl -fsSL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" -o /tmp/steamcmd.tar.gz
          tar -xzf /tmp/steamcmd.tar.gz -C "$HOME/steamcmd"
          "$HOME/steamcmd/steamcmd.sh" +quit || true

          managed="$VALHEIM_INSTALL/valheim_server_Data/Managed/assembly_valheim.dll"
          attempt=0
          while [ ! -f "$managed" ] && [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            "$HOME/steamcmd/steamcmd.sh" +force_install_dir "$VALHEIM_INSTALL" +login anonymous +app_update "$VALHEIM_APPID" validate +quit || true
            echo "steamcmd app_update attempt $attempt"
          done
          if [ ! -f "$managed" ]; then
            echo "Valheim dedicated server was not installed (app $VALHEIM_APPID)." >&2
            exit 1
          fi

          # Qmod.csproj resolves assemblies from valheim_Data/Managed (case-sensitive on Linux).
          mv "$VALHEIM_INSTALL/valheim_server_Data" "$VALHEIM_INSTALL/valheim_Data"

          curl -fsSL "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/${BEPINEX_PACK}/" -o /tmp/bepinex.zip
          rm -rf /tmp/BepInExRaw
          unzip -q /tmp/bepinex.zip -d /tmp/BepInExRaw
          core=$(find /tmp/BepInExRaw -type f -path '*/BepInEx/core/BepInEx.dll' -print -quit)
          if [ -z "$core" ]; then
            echo "BepInEx.dll was not found in BepInExPack_Valheim ${BEPINEX_PACK}." >&2
            exit 1
          fi
          pack_root=$(dirname "$(dirname "$(dirname "$core")")")
          cp -a "$pack_root"/. "$VALHEIM_INSTALL"/

          test -f "$VALHEIM_INSTALL/BepInEx/core/BepInEx.dll"
          test -f "$VALHEIM_INSTALL/valheim_Data/Managed/assembly_valheim.dll"

      - name: Build Release
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          dotnet build Qmod.sln --configuration Release --verbosity minimal \
            -p:VALHEIM_INSTALL="$VALHEIM_INSTALL" \
            -p:BEPINEX_PATH="$VALHEIM_INSTALL/BepInEx" \
            -p:MOD_DEPLOYPATH="$VALHEIM_INSTALL/BepInEx/plugins" \
            -p:UNITY_FOLDER="/tmp/no-unity"

      - name: Upload Thunderstore package
        uses: actions/upload-artifact@v6
        with:
          name: Qmod
          if-no-files-found: error
          retention-days: 14
          path: |
            Qmod/bin/Release/net48/Qmod.dll
            Qmod/Qmod.zip
