name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VALHEIM_INSTALL: C:\VHINSTALL
  VALHEIM_APPID: "896660"
  # Keep in sync with Qmod/Package/manifest.json (denikson-BepInExPack_Valheim).
  BEPINEX_PACK: "5.4.2333"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build Qmod
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Valheim dedicated server build id
        id: valheimversion
        shell: pwsh
        run: |
          $buildId = "unknown"
          try {
            $info = Invoke-RestMethod -Uri "https://api.steamcmd.net/v1/info/${{ env.VALHEIM_APPID }}" -TimeoutSec 60
            $buildId = [string]$info.data.'${{ env.VALHEIM_APPID }}'.depots.branches.public.buildid
          } catch {
            Write-Host "steamcmd.net lookup failed: $($_.Exception.Message)"
          }
          if ([string]::IsNullOrWhiteSpace($buildId)) { $buildId = "unknown" }
          Write-Host "Valheim dedicated server buildid: $buildId"
          "buildid=$buildId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache Valheim install
        id: cachevalheim
        uses: actions/cache@v5
        with:
          path: ${{ env.VALHEIM_INSTALL }}
          key: valheim-${{ steps.valheimversion.outputs.buildid }}-bepinex-${{ env.BEPINEX_PACK }}

      - name: Install Valheim dedicated server and BepInEx
        if: steps.cachevalheim.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $install = "${{ env.VALHEIM_INSTALL }}"
          $steamcmd = "C:\steamcmd\steamcmd.exe"

          New-Item -ItemType Directory -Force -Path C:\steamcmd | Out-Null
          Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile C:\steamcmd.zip
          Expand-Archive C:\steamcmd.zip -DestinationPath C:\steamcmd -Force

          & $steamcmd +quit
          Write-Host "steamcmd bootstrap exit $LASTEXITCODE"

          $managed = Join-Path $install "valheim_server_Data\Managed\assembly_valheim.dll"
          $attempts = 0
          do {
            $attempts++
            & $steamcmd +force_install_dir $install +login anonymous +app_update ${{ env.VALHEIM_APPID }} validate +quit
            Write-Host "steamcmd app_update exit $LASTEXITCODE (attempt $attempts)"
          } while (-not (Test-Path $managed) -and $attempts -lt 3)

          if (-not (Test-Path $managed)) {
            throw "Valheim dedicated server was not installed (app ${{ env.VALHEIM_APPID }})."
          }

          # Qmod.csproj resolves assemblies from valheim_Data/Managed.
          Rename-Item (Join-Path $install "valheim_server_Data") "valheim_Data"

          $bepinexZip = "C:\bepinex.zip"
          Invoke-WebRequest -Uri "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/${{ env.BEPINEX_PACK }}/" -OutFile $bepinexZip
          Expand-Archive $bepinexZip -DestinationPath C:\BepInExRaw -Force
          $core = Get-ChildItem -Path C:\BepInExRaw -Recurse -Filter BepInEx.dll |
            Where-Object { $_.Directory.Name -eq "core" } |
            Select-Object -First 1
          if (-not $core) { throw "BepInEx.dll was not found in BepInExPack_Valheim ${{ env.BEPINEX_PACK }}." }
          $packRoot = $core.Directory.Parent.Parent.FullName
          Copy-Item -Path (Join-Path $packRoot "*") -Destination $install -Recurse -Force

          if (-not (Test-Path (Join-Path $install "BepInEx\core\BepInEx.dll"))) {
            throw "BepInEx was not copied into $install."
          }
          if (-not (Test-Path (Join-Path $install "valheim_Data\Managed\assembly_valheim.dll"))) {
            throw "assembly_valheim.dll is missing after renaming valheim_server_Data."
          }

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build Qmod.sln --configuration Release --verbosity minimal `
            -p:VALHEIM_INSTALL="${{ env.VALHEIM_INSTALL }}" `
            -p:MOD_DEPLOYPATH="${{ env.VALHEIM_INSTALL }}\BepInEx\plugins" `
            -p:UNITY_FOLDER="C:\no-unity"

      - name: Upload Thunderstore package
        uses: actions/upload-artifact@v6
        with:
          name: Qmod
          if-no-files-found: error
          retention-days: 14
          path: |
            Qmod/bin/Release/net48/Qmod.dll
            Qmod/bin/Release/net48/Qmod.zip
